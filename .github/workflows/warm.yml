name: Daily Email Warmup

on:
  schedule:
    - cron: "0 13 * * *"  # 9am ET daily
  workflow_dispatch:       # allow manual trigger from GitHub UI

jobs:
  warm:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Run warmer
        env:
          ZOHO_EMAIL: ${{ secrets.ZOHO_EMAIL }}
          ZOHO_APP_PASSWORD: ${{ secrets.ZOHO_APP_PASSWORD }}
        run: python warmer.py

      - name: Commit updated log.json
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add log.json
          git diff --cached --quiet || git commit -m "chore: update log.json [$(date -u +%Y-%m-%d)]"
          git push
