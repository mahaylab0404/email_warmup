<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Email Warmup Dashboard</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #0a0a0f;
      color: #e2e8f0;
      min-height: 100vh;
      padding: 32px 24px;
    }

    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 36px;
    }

    .logo {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .logo-icon {
      width: 40px;
      height: 40px;
      background: linear-gradient(135deg, #6366f1, #a78bfa);
      border-radius: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 20px;
    }

    .logo h1 {
      font-size: 20px;
      font-weight: 700;
      color: #f8fafc;
    }

    .logo p {
      font-size: 12px;
      color: #64748b;
    }

    .status-badge {
      display: flex;
      align-items: center;
      gap: 8px;
      background: #0f172a;
      border: 1px solid #1e293b;
      border-radius: 20px;
      padding: 6px 14px;
      font-size: 13px;
      color: #94a3b8;
    }

    .status-dot {
      width: 8px;
      height: 8px;
      background: #22c55e;
      border-radius: 50%;
      animation: pulse 2s infinite;
    }

    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.4; }
    }

    .stats-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 16px;
      margin-bottom: 28px;
    }

    .stat-card {
      background: #0f172a;
      border: 1px solid #1e293b;
      border-radius: 14px;
      padding: 20px 24px;
      transition: border-color 0.2s;
    }

    .stat-card:hover { border-color: #334155; }

    .stat-label {
      font-size: 12px;
      color: #64748b;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      margin-bottom: 10px;
    }

    .stat-value {
      font-size: 32px;
      font-weight: 700;
      color: #f8fafc;
      line-height: 1;
    }

    .stat-sub {
      font-size: 12px;
      color: #475569;
      margin-top: 6px;
    }

    .accent-purple { color: #a78bfa; }
    .accent-green  { color: #4ade80; }
    .accent-blue   { color: #60a5fa; }
    .accent-orange { color: #fb923c; }

    .section {
      background: #0f172a;
      border: 1px solid #1e293b;
      border-radius: 14px;
      padding: 24px;
      margin-bottom: 20px;
    }

    .section-title {
      font-size: 14px;
      font-weight: 600;
      color: #cbd5e1;
      margin-bottom: 20px;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    /* Progress bar */
    .ramp-container { margin-bottom: 4px; }

    .ramp-row {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 14px;
    }

    .ramp-label {
      font-size: 12px;
      color: #64748b;
      width: 52px;
      flex-shrink: 0;
    }

    .ramp-bar-bg {
      flex: 1;
      height: 8px;
      background: #1e293b;
      border-radius: 4px;
      overflow: hidden;
    }

    .ramp-bar-fill {
      height: 100%;
      border-radius: 4px;
      background: linear-gradient(90deg, #6366f1, #a78bfa);
      transition: width 0.6s ease;
    }

    .ramp-bar-fill.current {
      background: linear-gradient(90deg, #4ade80, #22d3ee);
    }

    .ramp-count {
      font-size: 12px;
      color: #94a3b8;
      width: 48px;
      text-align: right;
      flex-shrink: 0;
    }

    /* Chart */
    .chart-area {
      position: relative;
      height: 140px;
      display: flex;
      align-items: flex-end;
      gap: 6px;
      padding-bottom: 24px;
    }

    .bar-wrap {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      height: 100%;
      justify-content: flex-end;
    }

    .bar {
      width: 100%;
      max-width: 32px;
      background: linear-gradient(180deg, #6366f1, #4338ca);
      border-radius: 4px 4px 0 0;
      min-height: 2px;
      transition: height 0.5s ease;
    }

    .bar.today {
      background: linear-gradient(180deg, #4ade80, #16a34a);
    }

    .bar-label {
      font-size: 10px;
      color: #475569;
      margin-top: 6px;
      position: absolute;
      bottom: 0;
    }

    /* Log table */
    .log-table {
      width: 100%;
      border-collapse: collapse;
      font-size: 13px;
    }

    .log-table th {
      text-align: left;
      font-size: 11px;
      color: #475569;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      padding: 0 12px 12px 0;
      border-bottom: 1px solid #1e293b;
    }

    .log-table td {
      padding: 10px 12px 10px 0;
      border-bottom: 1px solid #0f172a;
      color: #94a3b8;
    }

    .log-table tr:last-child td { border-bottom: none; }

    .log-table tr:hover td { color: #cbd5e1; }

    .badge {
      display: inline-flex;
      align-items: center;
      padding: 2px 8px;
      border-radius: 10px;
      font-size: 11px;
      font-weight: 500;
    }

    .badge-sent {
      background: #052e16;
      color: #4ade80;
      border: 1px solid #14532d;
    }

    .badge-failed {
      background: #2d0a0a;
      color: #f87171;
      border: 1px solid #7f1d1d;
    }

    .empty-state {
      text-align: center;
      padding: 40px 0;
      color: #334155;
      font-size: 14px;
    }

    .refresh-btn {
      background: #1e293b;
      border: 1px solid #334155;
      color: #94a3b8;
      border-radius: 8px;
      padding: 6px 14px;
      font-size: 13px;
      cursor: pointer;
      transition: all 0.15s;
    }

    .refresh-btn:hover {
      background: #334155;
      color: #f8fafc;
    }

    #last-updated {
      font-size: 12px;
      color: #334155;
      margin-top: 20px;
      text-align: center;
    }
  </style>
</head>
<body>

<header>
  <div class="logo">
    <div class="logo-icon">✉</div>
    <div>
      <h1>Email Warmup</h1>
      <p>mahayla@zuldeirasystems.com</p>
    </div>
  </div>
  <div style="display:flex;gap:10px;align-items:center">
    <button class="refresh-btn" onclick="loadData()">↻ Refresh</button>
    <div class="status-badge">
      <div class="status-dot"></div>
      <span id="status-text">Loading...</span>
    </div>
  </div>
</header>

<div class="stats-grid">
  <div class="stat-card">
    <div class="stat-label">Total Sent</div>
    <div class="stat-value accent-purple" id="stat-total">—</div>
    <div class="stat-sub">all time</div>
  </div>
  <div class="stat-card">
    <div class="stat-label">Sent Today</div>
    <div class="stat-value accent-green" id="stat-today">—</div>
    <div class="stat-sub" id="stat-today-limit">of — daily limit</div>
  </div>
  <div class="stat-card">
    <div class="stat-label">Current Day</div>
    <div class="stat-value accent-blue" id="stat-day">—</div>
    <div class="stat-sub" id="stat-week">Week —</div>
  </div>
  <div class="stat-card">
    <div class="stat-label">Success Rate</div>
    <div class="stat-value accent-orange" id="stat-rate">—</div>
    <div class="stat-sub">of all sends</div>
  </div>
</div>

<div style="display:grid;grid-template-columns:1fr 1fr;gap:20px;margin-bottom:20px">

  <div class="section">
    <div class="section-title">📈 Ramp Progress</div>
    <div class="ramp-container" id="ramp-bars"></div>
  </div>

  <div class="section">
    <div class="section-title">📊 Last 7 Days</div>
    <div class="chart-area" id="chart-area"></div>
  </div>

</div>

<div class="section">
  <div class="section-title">
    📋 Send Log
    <span style="margin-left:auto;font-size:12px;color:#475569;font-weight:400" id="log-count"></span>
  </div>
  <div id="log-container">
    <div class="empty-state">Loading log data...</div>
  </div>
</div>

<div id="last-updated"></div>

<script>
  const LOG_URL = "https://raw.githubusercontent.com/mahaylab0404/email_warmup/main/log.json";

  const RAMP = { 1: 3, 2: 6, 3: 12, 4: 20, 5: 40 };
  const MAX_RAMP = 40;

  function getDailyLimit(dayNum) {
    const week = Math.floor((dayNum - 1) / 7) + 1;
    return RAMP[week] ?? MAX_RAMP;
  }

  function getDayNum(log) {
    if (!log.length) return 1;
    const today = new Date().toISOString().split("T")[0];
    const dates = [...new Set(log.map(e => e.date))].sort();
    if (!dates.includes(today)) return dates.length + 1;
    return dates.indexOf(today) + 1;
  }

  async function loadData() {
    document.getElementById("status-text").textContent = "Fetching...";
    try {
      const res = await fetch(LOG_URL + "?t=" + Date.now());
      const log = res.ok ? await res.json() : [];

      const today = new Date().toISOString().split("T")[0];
      const sentToday = log.filter(e => e.date === today && e.status === "sent");
      const totalSent = log.filter(e => e.status === "sent").length;
      const totalFailed = log.filter(e => e.status && e.status.startsWith("failed")).length;
      const dayNum = getDayNum(log);
      const week = Math.floor((dayNum - 1) / 7) + 1;
      const dailyLimit = getDailyLimit(dayNum);
      const rate = log.length ? Math.round((totalSent / log.length) * 100) : 100;

      // Stats
      document.getElementById("stat-total").textContent = totalSent;
      document.getElementById("stat-today").textContent = sentToday.length;
      document.getElementById("stat-today-limit").textContent = `of ${dailyLimit} daily limit`;
      document.getElementById("stat-day").textContent = dayNum;
      document.getElementById("stat-week").textContent = `Week ${week}`;
      document.getElementById("stat-rate").textContent = rate + "%";
      document.getElementById("status-text").textContent = "Active";

      // Ramp bars
      const rampEl = document.getElementById("ramp-bars");
      rampEl.innerHTML = "";
      for (let w = 1; w <= 5; w++) {
        const limit = RAMP[w] ?? MAX_RAMP;
        const pct = Math.round((limit / MAX_RAMP) * 100);
        const isCurrent = w === week;
        rampEl.innerHTML += `
          <div class="ramp-row">
            <div class="ramp-label">Week ${w}</div>
            <div class="ramp-bar-bg">
              <div class="ramp-bar-fill ${isCurrent ? "current" : ""}" style="width:${pct}%"></div>
            </div>
            <div class="ramp-count">${limit}/day${isCurrent ? " ◀" : ""}</div>
          </div>`;
      }

      // 7-day bar chart
      const chartEl = document.getElementById("chart-area");
      chartEl.innerHTML = "";
      const last7 = [];
      for (let i = 6; i >= 0; i--) {
        const d = new Date();
        d.setDate(d.getDate() - i);
        const ds = d.toISOString().split("T")[0];
        const count = log.filter(e => e.date === ds && e.status === "sent").length;
        last7.push({ ds, count });
      }
      const maxCount = Math.max(...last7.map(d => d.count), 1);
      last7.forEach(({ ds, count }) => {
        const isToday = ds === today;
        const heightPct = Math.round((count / maxCount) * 100);
        const label = ds.slice(5); // MM-DD
        chartEl.innerHTML += `
          <div class="bar-wrap">
            <div class="bar ${isToday ? "today" : ""}" style="height:${Math.max(heightPct, 2)}%;width:100%" title="${count} sent on ${ds}"></div>
            <span class="bar-label">${label}</span>
          </div>`;
      });

      // Log table
      const logContainer = document.getElementById("log-container");
      const recent = [...log].reverse().slice(0, 50);
      document.getElementById("log-count").textContent = `${log.length} total entries`;

      if (!recent.length) {
        logContainer.innerHTML = `<div class="empty-state">No sends yet — run warmer.py to get started.</div>`;
      } else {
        logContainer.innerHTML = `
          <table class="log-table">
            <thead>
              <tr>
                <th>Date</th>
                <th>Time</th>
                <th>Recipient</th>
                <th>Subject</th>
                <th>Status</th>
              </tr>
            </thead>
            <tbody>
              ${recent.map(e => `
                <tr>
                  <td>${e.date}</td>
                  <td>${e.time}</td>
                  <td>${e.recipient}</td>
                  <td>${e.subject}</td>
                  <td><span class="badge ${e.status === "sent" ? "badge-sent" : "badge-failed"}">${e.status === "sent" ? "✓ sent" : "✗ failed"}</span></td>
                </tr>`).join("")}
            </tbody>
          </table>`;
      }

      document.getElementById("last-updated").textContent =
        "Last refreshed: " + new Date().toLocaleTimeString();

    } catch (err) {
      document.getElementById("status-text").textContent = "Error";
      document.getElementById("log-container").innerHTML =
        `<div class="empty-state">Could not load log data. The repo may be empty or private.<br><small>${err.message}</small></div>`;
    }
  }

  loadData();
  setInterval(loadData, 60000); // auto-refresh every minute
</script>

</body>
</html>
